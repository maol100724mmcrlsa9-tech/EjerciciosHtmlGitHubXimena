{% extends 'layout.html' %}
{% block body %}
<div class="row p-3 container bg-success text-white rounded" style="background-color: #157347 !important;">
    <div class="col-md-6 border border-white p-3">
        <h4>Modificar Usuario</h4>
        <form action="/ActualizarUsuario/{{ usuarios.id }}" method="POST">
            <p><b>Id:</b> <input type="text" value="{{ usuarios.id }}" class="form-control" disabled></p>
            <p><b>Nombre:</b> <input type="text" name="nombre" value="{{ usuarios.nombre }}" class="form-control" required></p>
            <p><b>Dirección:</b> <input type="text" name="direccion" value="{{ usuarios.direccion }}" class="form-control" required></p>
            <p><b>Teléfono:</b> <input type="text" name="telefono" value="{{ usuarios.telefono }}" class="form-control" required></p>
            <p><b>Correo:</b> <input type="email" name="correo" value="{{ usuarios.correo }}" class="form-control" required></p>
            <p><b>Curp:</b> <input type="text" name="curp" value="{{ usuarios.curp }}" class="form-control" required></p>
            <div class="mt-3">
                <button type="submit" class="btn btn-danger btn-sm">Actualizar</button>
                <a href="/Usuarios" class="btn btn-secondary btn-sm">Regresar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
