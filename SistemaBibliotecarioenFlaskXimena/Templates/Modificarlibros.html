<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% extends 'layout.html' %}
    {% block body %}
        <div class="row p-2 m-1 bg-success rounded justify-content-center">
            <div class="col-md-8 p-3 border border-white text-white">
                <form action="/ActualizarLibro/{{libros.0}}" method="POST">
                    <p class="h6 mb-2">Id:<input type="text" name="id" placeholder="Clave" value="{{ libros.0 }}" class="form-control form-control-sm"></p>
                    <p class="h6 mb-2">Titulo:<input type="text" name="titulo" placeholder="Titulo de libro" value="{{ libros.1 }}" class="form-control form-control-sm"></p>
                    <p class="h6 mb-2">Autor:<input type="text" name="autor" placeholder="Autor" value="{{ libros.2 }}" class="form-control form-control-sm"></p>
                    <p class="h6 mb-2">Edición:<input type="text" name="edicion" placeholder="Edición" value="{{ libros.3 }}" class="form-control form-control-sm"></p>
                    <p class="h6 mb-2">Año:<input type="text" name="año" placeholder="Año" value="{{ libros.4 }}" class="form-control form-control-sm"></p>
                    <p class="h6 mb-2">Editorial:<input type="text" name="editorial" placeholder="Editorial" value="{{ libros.5 }}" class="form-control form-control-sm"></p>
                    <p class="h6 mb-2">No. de Páginas:<input type="text" name="nopaginas" placeholder="Número de páginas" value="{{ libros.6 }}" class="form-control form-control-sm"></p>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-danger btn-sm">Actualizar</button>
                        <a href="/Libros" class="btn btn-secondary btn-sm">Regresar</a>
                    </div>
                </form>
            </div>
        </div>
    {% endblock %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
