{% extends "plantilla.html" %}

{% block body %}
<div class="row p-4 m-3 bg-success rounded text-white">
    <!-- Columna del Formulario -->
    <div class="col-md-4 p-3 border border-white rounded">
        <form action="/Agregar_Libro" method="POST">
            <div class="mb-2">
                <label class="form-label">Id:</label>
                <input type="text" class="form-control" name="id" placeholder="Clave" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Título:</label>
                <input type="text" class="form-control" name="titulo" placeholder="Título de Libro" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Autor:</label>
                <input type="text" class="form-control" name="autor" placeholder="Autor">
            </div>
            <div class="mb-2">
                <label class="form-label">Edición:</label>
                <input type="text" class="form-control" name="edicion" placeholder="Edición">
            </div>
            <div class="mb-2">
                <label class="form-label">Año:</label>
                <input type="text" class="form-control" name="año" placeholder="Año">
            </div>
            <div class="mb-2">
                <label class="form-label">Editorial:</label>
                <input type="text" class="form-control" name="editorial" placeholder="Editorial">
            </div>
            <div class="mb-3">
                <label class="form-label">No. de Páginas:</label>
                <input type="text" class="form-control" name="nopaginas" placeholder="Número de páginas">
            </div>
            <button type="submit" class="btn btn-light text-dark fw-bold">Guardar</button>
            <a href="/Menuprincipal" class="btn btn-secondary">Regresar</a>
        </form>
    </div>

    <!-- Columna de la Tabla -->
    <div class="col-md-8 p-3 border border-white rounded">
        <table class="table table-striped table-bordered bg-white table-sm align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Id</th>
                    <th>Título</th>
                    <th>Autor</th>
                    <th>Edición</th>
                    <th>Año</th>
                    <th>Editorial</th>
                    <th>NoPaginas</th>
                </tr>
            </thead>
            <tbody>
                {% for libro in libros %}
                <tr>
                    <td>{{ libro.0 }}</td>
                    <td>{{ libro.1 }}</td>
                    <td>{{ libro.2 }}</td>
                    <td>{{ libro.3 }}</td>
                    <td>{{ libro.4 }}</td>
                    <td>{{ libro.5 }}</td>
                    <td>{{ libro.6 }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
